<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Secure Bank</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon"><i class="fas fa-university"></i></div>
                <h1>Secure <span>Bank</span></h1>
                <p>Create a new account</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="form-control" id="regName" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-group">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" class="form-control" id="regPhone" placeholder="Enter 10-digit phone number" maxlength="10" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-control" id="regPassword" placeholder="Create a password (min 6 chars)" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-hint">Minimum 6 characters</div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirm your password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="index.html">Sign In</a>
            </div>
        </div>
    </div>

    <div class="notification-container" id="notificationContainer"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner spinner-lg"></div>
        <div class="loading-text">Creating your account...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!name || !email || !phone || !password || !confirmPassword) {
                Utils.showNotification('Error', 'Please fill in all fields.', 'error');
                return;
            }
            if (phone.length !== 10 || !/^\d{10}$/.test(phone)) {
                Utils.showNotification('Error', 'Please enter a valid 10-digit phone number.', 'error');
                return;
            }
            if (password.length < 6) {
                Utils.showNotification('Error', 'Password must be at least 6 characters.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                Utils.showNotification('Error', 'Passwords do not match.', 'error');
                return;
            }

            Utils.showLoading();
            try {
                const result = await Auth.register(name, email, phone, password);
                Utils.hideLoading();
                Utils.showNotification('Account Created!',
                    `Your account number is ${result.accountNumber}. Redirecting to login...`, 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            } catch (err) {
                Utils.hideLoading();
                let msg = 'Registration failed. Please try again.';
                if (err.code === 'auth/email-already-in-use') msg = 'An account with this email already exists.';
                else if (err.code === 'auth/weak-password') msg = 'Password is too weak. Use at least 6 characters.';
                else if (err.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
                Utils.showNotification('Registration Failed', msg, 'error');
            }
        });
    </script>
</body>
</html>
